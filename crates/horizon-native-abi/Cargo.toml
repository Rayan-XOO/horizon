[package]
name = "horizon-native-abi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "The C ABI of prebuilt native mods (.hnmod binaries, docs/android-mods.md): what a mod exports, what the game hands it"

[dependencies]
# The game's side (feature `host`): opening a mod's library.
libloading = { version = "0.8", optional = true }

[features]
host = ["dep:libloading"]

[lints]
workspace = true
