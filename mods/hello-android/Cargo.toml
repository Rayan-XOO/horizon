[package]
name = "hello-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The smallest prebuilt native mod: a HUD line, a chat command and a key (docs/android-mods.md)"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-native-abi = { path = "../../crates/horizon-native-abi" }

[profile.release]
strip = true
panic = "unwind"

# Its own workspace: built with cargo ndk, not with the game.
[workspace]
