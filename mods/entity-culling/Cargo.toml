[package]
name = "entity-culling"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Entity Culling for Horizon: hides entities, block entities and name tags behind blocks"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-native-abi = { path = "../../crates/horizon-native-abi" }

[profile.release]
strip = true
panic = "unwind"

# Its own workspace: built with cargo ndk, not with the game.
[workspace]
